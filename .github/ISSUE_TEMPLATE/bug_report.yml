name: Сообщить об ошибке / Bug report
description: Что-то работает неправильно / Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Перед отправкой проверьте, что нет похожего issue. / Please check for an existing issue first.
        **Не публикуйте** серийные номера и личные данные из логов. / Do not post serial numbers or personal data from logs.
  - type: input
    id: version
    attributes:
      label: Версия DriverTool / DriverTool version
      placeholder: v1.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows / Windows version
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Запущено от администратора? / Run as administrator?
      options: ["Да / Yes", "Нет / No"]
    validations:
      required: true
  - type: dropdown
    id: tab
    attributes:
      label: Вкладка / Tab
      options: [Устройства, Обновления Windows, Каталог Microsoft, Авто-подбор, Обслуживание, Резервная копия, Другое]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что произошло и что ожидалось / What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения / Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Журнал / Log
      description: Файл `%LOCALAPPDATA%\DriverTool\driver-tool.log` (кнопка «Папка с данными» на вкладке «Обслуживание»).
      render: text

name: Release

# Push a tag like v1.2.0 and the exe is built and attached to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name DriverTool --icon icon.ico --add-data "scripts;scripts" --add-data "icon.ico;." app.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/DriverTool.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/DriverTool.exe --title "DriverTool $GITHUB_REF_NAME" --generate-notes
          fi
